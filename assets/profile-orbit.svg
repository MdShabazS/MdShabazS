      <text x="156" y="20" fill="#BBF7D0" font-size="12" font-weight="700">Embedded C · STM32</text>
      <rect x="292" width="130" height="30" rx="15" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.32"/>
      <text x="310" y="20" fill="#FDE68A" font-size="12" font-weight="700">OpenCV · TFLite</text>
